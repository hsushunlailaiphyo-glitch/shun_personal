<!DOCTYPE html>
<html lang="en" data-theme="blush">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for nann wai</title>
<meta name="description" content="a small place made for nann wai.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff6f9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#10084;&#65039;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Inter:wght@300;400;500;600&family=Caveat:wght@500;600&family=Noto+Sans+Myanmar:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- film grain overlay, sits above everything, ignores clicks -->
<div class="grain" aria-hidden="true"></div>

<!-- ============ THE GATE (countdown before her birthday) ============ -->
<div id="gate" class="gate" hidden>
  <div class="gate-inner">
    <p class="gate-eyebrow" id="gate-eyebrow">something is waiting for</p>
    <h1 class="gate-name" id="gate-name">Nann Wai</h1>
    <div class="countdown" id="countdown" role="timer" aria-live="off">
      <div class="cd-unit"><span class="cd-num" id="cd-days">--</span><span class="cd-label">days</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cd-hours">--</span><span class="cd-label">hours</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cd-mins">--</span><span class="cd-label">minutes</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-unit"><span class="cd-num" id="cd-secs">--</span><span class="cd-label">seconds</span></div>
    </div>
    <p class="gate-note" id="gate-note"></p>
    <p class="gate-sign" id="gate-sign"></p>
  </div>
</div>

<!-- ============ THE SITE ============ -->
<div id="site" class="site" hidden>

  <!-- theme picker -->
  <div class="theme-bar" id="theme-bar">
    <button class="theme-toggle" id="theme-toggle" aria-expanded="false" aria-controls="theme-list" title="change the colours">
      <span class="theme-dot" aria-hidden="true"></span>
      <span class="theme-toggle-text">colours</span>
    </button>
    <div class="theme-list" id="theme-list" hidden></div>
  </div>

  <!-- hero -->
  <header class="hero" id="top">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap">
      <p class="eyebrow reveal" id="hero-eyebrow"></p>
      <h1 class="hero-title reveal" id="hero-title"></h1>
      <p class="hero-sub reveal" id="hero-sub"></p>
      <div class="hero-body reveal" id="hero-body"></div>
      <nav class="hero-nav reveal" id="hero-nav" aria-label="sections"></nav>
    </div>
    <div class="scroll-hint reveal" aria-hidden="true"><span></span></div>
  </header>

  <main>
    <!-- videos — the first thing she sees -->
    <section class="section" id="videos">
      <div class="wrap">
        <p class="eyebrow reveal">no. 01</p>
        <h2 class="section-title reveal" id="videos-title"></h2>
        <p class="section-lede reveal" id="videos-lede"></p>
        <div class="video-grid" id="video-grid"></div>
      </div>
    </section>

    <!-- letters -->
    <section class="section section-alt" id="letters">
      <div class="wrap">
        <p class="eyebrow reveal">no. 02</p>
        <h2 class="section-title reveal" id="letters-title"></h2>
        <p class="section-lede reveal" id="letters-lede"></p>
        <div class="letter-grid" id="letter-grid"></div>
      </div>
    </section>

    <!-- open when -->
    <section class="section" id="openwhen">
      <div class="wrap">
        <p class="eyebrow reveal">no. 03</p>
        <h2 class="section-title reveal" id="ow-title"></h2>
        <p class="section-lede reveal" id="ow-lede"></p>
        <div class="env-grid" id="env-grid"></div>
        <p class="ow-foot reveal" id="ow-foot"></p>
      </div>
    </section>

    <!-- photos -->
    <section class="section section-alt" id="photos">
      <div class="wrap">
        <p class="eyebrow reveal">no. 04</p>
        <h2 class="section-title reveal" id="photos-title"></h2>
        <p class="section-lede reveal" id="photos-lede"></p>
        <div class="photo-grid" id="photo-grid"></div>
      </div>
    </section>

    <!-- music -->
    <section class="section" id="music">
      <div class="wrap">
        <p class="eyebrow reveal">no. 05</p>
        <h2 class="section-title reveal" id="music-title"></h2>
        <p class="section-lede reveal" id="music-lede"></p>
        <div class="track-list" id="track-list"></div>
      </div>
    </section>

    <!-- closing -->
    <section class="section closing" id="closing">
      <div class="wrap">
        <h2 class="closing-title reveal" id="closing-title"></h2>
        <div class="closing-body reveal" id="closing-body"></div>
        <p class="closing-sign reveal" id="closing-sign"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p id="footer-next" class="footer-next"></p>
      <p class="footer-made" id="footer-made"></p>
    </div>
  </footer>
</div>

<!-- ============ READER (opens letters + envelopes) ============ -->
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
  <div class="reader-backdrop" data-close></div>
  <article class="reader-card" role="document">
    <button class="reader-close" id="reader-close" aria-label="close">&times;</button>
    <p class="reader-eyebrow" id="reader-eyebrow"></p>
    <h3 class="reader-title" id="reader-title"></h3>
    <div class="reader-body" id="reader-body"></div>
    <div class="reader-video" id="reader-video"></div>
    <div class="reader-photos" id="reader-photos"></div>
    <p class="reader-sign" id="reader-sign"></p>
    <p class="reader-meta" id="reader-meta"></p>
  </article>
</div>

<!-- ============ LIGHTBOX (photos) ============ -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="photo">
  <div class="reader-backdrop" data-close></div>
  <button class="lb-close" id="lb-close" aria-label="close">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="previous photo">&#8249;</button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="next photo">&#8250;</button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
</div>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
