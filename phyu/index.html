<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten out of Ten — for Phyu Phway</title>
<meta name="description" content="a small place made for phyu phway.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128142;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="sparkle-layer" aria-hidden="true"></div>

<!-- ============ THE GATE: the clock before midnight ============ -->
<div id="gate" class="gate" hidden>
  <div class="gate-inner">
    <p class="gate-eyebrow" id="gate-eyebrow"></p>
    <h1 class="gate-name" id="gate-name"></h1>

    <div class="clock" aria-hidden="true">
      <svg viewBox="0 0 200 200" class="clock-face">
        <circle cx="100" cy="100" r="94" class="clock-rim"/>
        <circle cx="100" cy="100" r="86" class="clock-inner"/>
        <g id="clock-ticks"></g>
        <line x1="100" y1="100" x2="100" y2="52" class="clock-hand clock-hour" id="hand-hour"/>
        <line x1="100" y1="100" x2="100" y2="34" class="clock-hand clock-minute" id="hand-min"/>
        <line x1="100" y1="100" x2="100" y2="28" class="clock-hand clock-second" id="hand-sec"/>
        <circle cx="100" cy="100" r="5" class="clock-pin"/>
      </svg>
    </div>

    <div class="countdown" id="countdown" role="timer">
      <div class="cd-unit"><span class="cd-num" id="cd-days">--</span><span class="cd-label">days</span></div>
      <div class="cd-unit"><span class="cd-num" id="cd-hours">--</span><span class="cd-label">hours</span></div>
      <div class="cd-unit"><span class="cd-num" id="cd-mins">--</span><span class="cd-label">minutes</span></div>
      <div class="cd-unit"><span class="cd-num" id="cd-secs">--</span><span class="cd-label">seconds</span></div>
    </div>

    <p class="gate-note" id="gate-note"></p>
    <p class="gate-sign" id="gate-sign"></p>
  </div>
</div>

<!-- ============ THE SITE ============ -->
<div id="site" class="site" hidden>

  <div class="theme-bar">
    <button class="theme-toggle" id="theme-toggle" aria-expanded="false" aria-controls="theme-list" title="change the colours">
      <span class="theme-dot" aria-hidden="true"></span>
      <span class="theme-toggle-text">colours</span>
    </button>
    <div class="theme-list" id="theme-list" hidden></div>
  </div>

  <header class="hero" id="top">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap">
      <p class="eyebrow reveal" id="hero-eyebrow"></p>
      <h1 class="hero-title reveal" id="hero-title"></h1>
      <p class="hero-sub reveal" id="hero-sub"></p>
      <div class="hero-body reveal" id="hero-body"></div>
      <nav class="hero-nav reveal" id="hero-nav" aria-label="sections"></nav>
    </div>
  </header>

  <main>
    <!-- TODAY: the daily check-in -->
    <section class="section" id="today">
      <div class="wrap">
        <p class="eyebrow reveal" id="today-date"></p>
        <h2 class="section-title reveal" id="today-title"></h2>
        <p class="section-lede reveal" id="today-lede"></p>

        <div class="today-grid reveal">
          <div class="panel">
            <h3 class="panel-title">how was today?</h3>
            <div class="mood-row" id="mood-row"></div>
            <input class="mood-note" id="mood-note" type="text" maxlength="140"
                   placeholder="one line about today (optional)" aria-label="a line about today">
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3 class="panel-title">today's habits</h3>
              <button class="mini-btn" id="habit-edit">edit</button>
            </div>
            <ul class="habit-list" id="habit-list"></ul>
            <form class="add-row" id="habit-add" hidden>
              <input type="text" id="habit-new" maxlength="28" placeholder="add a habit" aria-label="new habit">
              <button type="submit" class="mini-btn solid">add</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- THE YEAR -->
    <section class="section section-alt" id="year">
      <div class="wrap">
        <p class="eyebrow reveal">no. 02</p>
        <h2 class="section-title reveal" id="year-title"></h2>
        <p class="section-lede reveal" id="year-lede"></p>
        <div class="year-legend reveal" id="year-legend"></div>
        <div class="year-months" id="year-months"></div>
        <p class="year-stats reveal" id="year-stats"></p>
      </div>
    </section>

    <!-- COUNTDOWNS -->
    <section class="section" id="counting">
      <div class="wrap">
        <p class="eyebrow reveal">no. 03</p>
        <h2 class="section-title reveal" id="cd-title"></h2>
        <p class="section-lede reveal" id="cd-lede"></p>
        <div class="cd-grid" id="cd-grid"></div>
        <form class="add-row wide reveal" id="cd-add">
          <input type="text" id="cd-new-title" maxlength="40" placeholder="what are you waiting for?" aria-label="countdown name" required>
          <input type="date" id="cd-new-date" aria-label="countdown date" required>
          <button type="submit" class="mini-btn solid">add</button>
        </form>
      </div>
    </section>

    <!-- WISHES -->
    <section class="section section-alt" id="wishes">
      <div class="wrap">
        <p class="eyebrow reveal">no. 04</p>
        <h2 class="section-title reveal" id="wish-title"></h2>
        <p class="section-lede reveal" id="wish-lede"></p>
        <ul class="wish-list" id="wish-list"></ul>
        <form class="add-row wide reveal" id="wish-add">
          <input type="text" id="wish-new" maxlength="90" placeholder="something you want from this year" aria-label="new wish" required>
          <button type="submit" class="mini-btn solid">add</button>
        </form>
      </div>
    </section>

    <!-- NOTES -->
    <section class="section" id="notes">
      <div class="wrap">
        <p class="eyebrow reveal">no. 05</p>
        <h2 class="section-title reveal" id="notes-title"></h2>
        <p class="section-lede reveal" id="notes-lede"></p>
        <div class="note-grid" id="note-grid"></div>
      </div>
    </section>

    <!-- MUSIC -->
    <section class="section section-alt" id="music">
      <div class="wrap">
        <p class="eyebrow reveal">no. 06</p>
        <h2 class="section-title reveal" id="music-title"></h2>
        <p class="section-lede reveal" id="music-lede"></p>
        <div class="music-cols" id="music-cols"></div>
      </div>
    </section>

    <!-- PHOTOS -->
    <section class="section" id="photos">
      <div class="wrap">
        <p class="eyebrow reveal">no. 07</p>
        <h2 class="section-title reveal" id="photos-title"></h2>
        <p class="section-lede reveal" id="photos-lede"></p>
        <div class="photo-grid" id="photo-grid"></div>
      </div>
    </section>

    <section class="section closing">
      <div class="wrap">
        <h2 class="closing-title reveal" id="closing-title"></h2>
        <div class="closing-body reveal" id="closing-body"></div>
        <p class="closing-sign reveal" id="closing-sign"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer-next" id="footer-next"></p>
      <p class="footer-sync" id="footer-sync"></p>
      <p class="footer-made" id="footer-made"></p>
    </div>
  </footer>
</div>

<!-- reader for the notes -->
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
  <div class="reader-backdrop" data-close></div>
  <article class="reader-card">
    <button class="reader-close" id="reader-close" aria-label="close">&times;</button>
    <p class="reader-eyebrow" id="reader-eyebrow"></p>
    <h3 class="reader-title" id="reader-title"></h3>
    <div class="reader-body" id="reader-body"></div>
    <p class="reader-sign" id="reader-sign"></p>
  </article>
</div>

<!-- day editor for the year grid -->
<div class="reader" id="dayedit" hidden role="dialog" aria-modal="true" aria-labelledby="dayedit-title">
  <div class="reader-backdrop" data-close></div>
  <article class="reader-card narrow">
    <button class="reader-close" id="dayedit-close" aria-label="close">&times;</button>
    <p class="reader-eyebrow">looking back</p>
    <h3 class="reader-title" id="dayedit-title"></h3>
    <div class="mood-row" id="dayedit-moods"></div>
    <input class="mood-note" id="dayedit-note" type="text" maxlength="140" placeholder="one line about that day" aria-label="note">
  </article>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="photo">
  <div class="reader-backdrop" data-close></div>
  <button class="lb-close" id="lb-close" aria-label="close">&times;</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="previous">&#8249;</button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="next">&#8250;</button>
  <figure class="lb-figure"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
